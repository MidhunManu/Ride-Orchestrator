version: "3.8"

services:

  service-discovery:
    build: ./ServiceDiscovery
    container_name: service-discovery
    ports:
      - "8761:8761"
    networks:
      - ride-net

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: users
    ports:
      - "3306:3306"
    networks:
      - ride-net
    volumes:
      - mysql-data:/var/lib/mysql

  api-gateway:
    build: ./APIGateway
    container_name: api-gateway
    ports:
      - "8081:8081"
    depends_on:
      - service-discovery
    networks:
      - ride-net
    restart: always

  auth-service:
    build: ./AuthMicroService
    container_name: auth-service
    ports:
      - "8083:8083"
    depends_on:
      - service-discovery
      - mysql
    networks:
      - ride-net
    restart: always

  user-service:
    build: ./UserMicroService
    container_name: user-service
    ports:
      - "8082:8082"
    depends_on:
      - service-discovery
      - mysql
    networks:
      - ride-net
    restart: always

networks:
  ride-net:

volumes:
  mysql-data: